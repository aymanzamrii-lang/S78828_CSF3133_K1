
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade Calculator</title>

    <!-- Error 1 (grade.html, Line 9): Missing return before checkMark(). -->
    <!-- Error 2 (grade.html, Line 17): showtable() does not match showTable(). -->
    <!-- Error 3 (grade.html, Line 19): grades.js changed to grade.js. -->

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h2>Student Grade Calculator</h2>

    <form name="gradeForm" onsubmit="return checkMark()">

        <label for="name">Name:</label>
        <input type="text" id="name" name="name"><br>

        <label for="mark">Mark (0-100):</label>
        <input type="text" id="mark" name="mark"><br>

        <button type="submit">Check Grade</button>
        <button type="button" onclick="randomMark()">Random Mark</button>

    </form>

    <p id="result"></p>
    <p id="checkDate"></p>

    <button type="button" onclick="showTable()">Show Grade Table</button>

    <div id="tableContainer"></div>

    <script src="grade.js"></script>

</body>
</html>
